# Compilation et tests sous Windows : seul Windows compile tout le XAML (x:Class
# compris) et lance les tests WPF. Un runner Windows consomme deux fois plus de
# minutes GitHub Actions qu'un runner Linux sur un dépôt privé.
name: CI

# La documentation seule ne relance pas la CI : rien n'y compile.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Une poussée annule la vérification encore en cours de la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Restauration
        run: dotnet restore Mkm.Wpf.sln

      - name: Compilation
        run: dotnet build Mkm.Wpf.sln --configuration Release --no-restore

      - name: Tests
        run: dotnet test Mkm.Wpf.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore

      # Les pages de la vitrine en PNG, dans chaque thème (Mkm.Wpf.Showcase --captures) : le rendu
      # se regarde sans poste Windows, dans l'artefact « captures ».
      - name: Captures de la vitrine
        shell: pwsh
        run: |
          $exe = "apps/Mkm.Wpf.Showcase/bin/Release/net48/Mkm.Wpf.Showcase.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--captures', "`"$PWD\captures`"" -Wait -PassThru
          Write-Output "Code de sortie : $($p.ExitCode)"
          if (Test-Path captures/journal.txt) { Get-Content captures/journal.txt } else { Write-Output "pas de journal" }
          if ($p.ExitCode -ne 0) {
            # L'erreur d'un arrêt brutal, telle que .NET l'écrit au journal de Windows.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error' } -MaxEvents 3 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.TimeCreated; $_.Message }
            exit 1
          }

      - name: Publication des captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: captures
          path: captures
          if-no-files-found: ignore
